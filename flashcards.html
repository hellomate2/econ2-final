<script>window.DECK=[{"u": "01-labor", "t": "Labor and wages", "f": "What is the marginal product of labor (MPL)?", "b": "The extra output produced by one more worker, holding capital and everything else fixed."}, {"u": "01-labor", "t": "Labor and wages", "f": "Why does MPL fall as a firm hires more workers?", "b": "Diminishing returns: the extra workers share the same fixed equipment and space, so each adds less output."}, {"u": "01-labor", "t": "Labor and wages", "f": "What is the formula for the marginal revenue product of labor?", "b": "MRPL = MR x MPL. It is the extra revenue one more worker generates: extra units times extra revenue per unit."}, {"u": "01-labor", "t": "Labor and wages", "f": "What is VMPL, and when does it equal MRPL?", "b": "VMPL = P x MPL, the value of the marginal product of labor. It equals MRPL for a competitive firm, because a competitive firm's MR is the price."}, {"u": "01-labor", "t": "Labor and wages", "f": "For a firm with market power, how does MRPL compare with P x MPL?", "b": "MRPL is below P x MPL, because the firm must cut its price to sell more, so its MR is below the price."}, {"u": "01-labor", "t": "Labor and wages", "f": "What is the firm's hiring rule?", "b": "Hire up to the point where MRPL = W. Hire every worker whose MRPL is at least the wage."}, {"u": "01-labor", "t": "Labor and wages", "f": "Why is the MRPL curve the labor demand curve?", "b": "At any wage the firm hires the quantity where MRPL equals that wage, so the MRPL curve shows how many workers it wants at each wage."}, {"u": "01-labor", "t": "Labor and wages", "f": "Does the MRPL curve slope down because of market power?", "b": "No. His slide says it slopes down because adding workers without adding capital or space reduces their marginal product."}, {"u": "01-labor", "t": "Labor and wages", "f": "Where does labor demand come from, and where does labor supply come from?", "b": "Demand comes from firms' profit maximization. Supply comes from households' utility maximization."}, {"u": "01-labor", "t": "Labor and wages", "f": "What is the price of an hour of leisure?", "b": "The wage, because that is the income you give up by not working the hour."}, {"u": "01-labor", "t": "Labor and wages", "f": "What is the rational spending rule applied to labor supply?", "b": "MU(leisure) / W = MU(goods) / P(goods). The last dollar's worth of free time should give the same extra utility as the last dollar spent on goods."}, {"u": "01-labor", "t": "Labor and wages", "f": "What are the substitution and income effects of a wage increase on hours worked?", "b": "Substitution: leisure is more expensive, so work more. Income: you are richer and want more leisure, so work less. Which wins is an empirical question."}, {"u": "01-labor", "t": "Labor and wages", "f": "Which way does labor supply slope in this course, and why?", "b": "Upward. The course assumes the substitution effect dominates the income effect."}, {"u": "01-labor", "t": "Labor and wages", "f": "What shifts labor demand out?", "b": "A higher output price or MR, or a higher MPL from more capital or better technology."}, {"u": "01-labor", "t": "Labor and wages", "f": "What happens if the wage itself changes?", "b": "It is a movement along the labor demand curve, not a shift."}, {"u": "01-labor", "t": "Labor and wages", "f": "Fall 2025 final Q4(c): China stops buying U.S. soybeans. What happens in the soybean workers' labor market?", "b": "The soybean price, which is the farms' MR, falls, so MRPL = MR x MPL shifts inward at every L. Supply does not move. The wage and employment fall."}, {"u": "01-labor", "t": "Labor and wages", "f": "In Q4(b), if the crop is already planted and cannot be stored or destroyed, where does the price go after exports stop?", "b": "Down the domestic demand curve to the price at which Americans buy the whole crop, a very large drop from the world price."}, {"u": "01-labor", "t": "Labor and wages", "f": "On an export graph, where is the world price and what are exports?", "b": "The world price is a horizontal line above the domestic equilibrium price. Exports are the horizontal gap between domestic quantity supplied and quantity demanded at that price."}, {"u": "01-labor", "t": "Labor and wages", "f": "The housing bust of 2008: what happened to construction workers, and why?", "b": "Demand for construction fell, its price (MR) fell, so MRPL fell and labor demand shifted in. Wages and employment of construction workers fell."}, {"u": "01-labor", "t": "Labor and wages", "f": "How does computer technology affect high-skilled workers whose jobs use computers?", "b": "It raises their MPL, which normally raises MRPL, so labor demand shifts out and their wages and employment rise."}, {"u": "01-labor", "t": "Labor and wages", "f": "When can higher productivity lower MRPL?", "b": "When the product's price falls by more than MPL rises. Multiply the factors: MPL x1.5 and price x0.6 gives 0.9, so MRPL falls 10%."}, {"u": "01-labor", "t": "Labor and wages", "f": "Price falls 20% and MPL rises 50%. What happens to MRPL?", "b": "0.8 x 1.5 = 1.2, so MRPL rises 20% and labor demand shifts out."}, {"u": "01-labor", "t": "Labor and wages", "f": "What does more low-skilled immigration do to that labor market?", "b": "Labor supply shifts out. The wage falls and employment rises. Demand does not move."}, {"u": "01-labor", "t": "Labor and wages", "f": "What does removing many workers do to their labor market?", "b": "Labor supply shifts in. The wage rises and employment falls."}, {"u": "01-labor", "t": "Labor and wages", "f": "Why are city-by-city comparisons of immigration and wages misleading?", "b": "Immigrants often go where labor demand is growing, so rising demand can hide the supply effect. Immigration is not a randomly applied treatment."}, {"u": "01-labor", "t": "Labor and wages", "f": "What was the Mariel boatlift?", "b": "From May to September 1980, 125,000 Cubans migrated to the U.S., almost all to Miami, for political reasons. Card used it as a natural experiment."}, {"u": "01-labor", "t": "Labor and wages", "f": "What did Card find in Miami, and how did he explain it?", "b": "No obvious effect on wages. Some migration to Miami that would have happened did not, and labor demand was probably very elastic."}, {"u": "01-labor", "t": "Labor and wages", "f": "If labor demand is very elastic, what does a supply increase do?", "b": "The wage falls only slightly and employment rises a lot."}, {"u": "01-labor", "t": "Labor and wages", "f": "What does a union wage above equilibrium do?", "b": "It acts like a price floor: those employed earn more, firms cut hiring to where MRPL equals the wage, and unemployment equals LS minus LD."}, {"u": "01-labor", "t": "Labor and wages", "f": "D: W = 30 - 2L, S: W = 6 + 2L. Find the equilibrium.", "b": "30 - 2L = 6 + 2L gives L = 6 and W = $18."}, {"u": "01-labor", "t": "Labor and wages", "f": "Same market, minimum wage $22. Employment and unemployment?", "b": "Demand: 30 - 2L = 22 gives 4 employed. Supply: 6 + 2L = 22 gives 8 who want work. Unemployment is 4."}, {"u": "01-labor", "t": "Labor and wages", "f": "What does a minimum wage below the equilibrium wage do?", "b": "Nothing. The floor does not bind because the market already pays more."}, {"u": "01-labor", "t": "Labor and wages", "f": "Does a one-time payment to farm owners shift labor demand?", "b": "No. It changes neither MR nor MPL, so MRPL and labor demand stay the same."}, {"u": "01-labor", "t": "Labor and wages", "f": "What does 'high-skilled' usually mean in economics and the news?", "b": "Highly credentialed: workers with more formal education, such as a college degree."}, {"u": "01-labor", "t": "Labor and wages", "f": "What is monopsony, and is it on his exams?", "b": "A buyer of labor with market power. His slides say it won't be on the exams; it is left for ECON 151."}, {"u": "01-labor", "t": "Labor and wages", "f": "Farm table: MPL 100, 80, 60, 40, 20 and P = $10, wage $350. How many workers?", "b": "VMPL is $1,000, $800, $600, $400, $200. Hire 4, since the 4th adds $400 and the 5th only $200."}, {"u": "01-labor", "t": "Labor and wages", "f": "Same farm, price falls to $5. How many workers?", "b": "VMPL is $500, $400, $300. Hire 2, since the 3rd adds only $300, less than $350."}, {"u": "01-labor", "t": "Labor and wages", "f": "How should you label the labor demand curve on the exam?", "b": "'D = MRPL', and name the piece of MR x MPL that changed when you explain a shift."}, {"u": "02-inequality", "t": "Inequality", "f": "What three types of economic inequality does he list?", "b": "Opportunity inequality, wealth inequality, and income inequality."}, {"u": "02-inequality", "t": "Inequality", "f": "Which kind of inequality does he focus on, and why?", "b": "Labor income inequality: we have the labor market diagram as a tool, and it is the main source of rising U.S. income inequality."}, {"u": "02-inequality", "t": "Inequality", "f": "What is a fractile?", "b": "A slice of a distribution defined by percentiles, such as P90-95 or the 99th percentile and above."}, {"u": "02-inequality", "t": "Inequality", "f": "How do you compute a top income share?", "b": "Income of the top group divided by total income of everyone. Top 10% with $36 million of $80 million has a 45% share."}, {"u": "02-inequality", "t": "Inequality", "f": "Top 10% share is 44% and top 1% share is 16%. What is the P90-99 share?", "b": "44% minus 16% = 28%."}, {"u": "02-inequality", "t": "Inequality", "f": "Why did Piketty and Saez use tax returns?", "b": "Survey data tell us little about incomes at the very top, but tax returns can, back to the start of the income tax in 1913."}, {"u": "02-inequality", "t": "Inequality", "f": "How did Piketty and Saez compute top shares?", "b": "Total income from other sources, the number of tax units from the Census, and the incomes of top groups from tax data; then divide."}, {"u": "02-inequality", "t": "Inequality", "f": "What is the history of U.S. top income shares?", "b": "High before World War II, low up to the 1970s, and rising strongly since then."}, {"u": "02-inequality", "t": "Inequality", "f": "When did labor income inequality start rising?", "b": "In the early 1970s. The very top rose even faster."}, {"u": "02-inequality", "t": "Inequality", "f": "In 2021, what income put a household in the top 1%?", "b": "Above $630,000 (Piketty and Saez, his slide 24)."}, {"u": "02-inequality", "t": "Inequality", "f": "What two explanations for rising inequality work inside a competitive labor market?", "b": "Skill-biased technological change and globalization."}, {"u": "02-inequality", "t": "Inequality", "f": "What does skill-biased technological change do on the two-market graph?", "b": "It raises high-skilled workers' MPL, so high-skill labor demand shifts out. The low-skill market does not change, so the wage gap grows."}, {"u": "02-inequality", "t": "Inequality", "f": "Tax software: MPL 2 to 3 returns an hour, price $100 to $80. What happens to adopters' MRPL?", "b": "2 x $100 = $200 before, 3 x $80 = $240 after, up 20%, so their labor demand shifts out."}, {"u": "02-inequality", "t": "Inequality", "f": "Same software: what happens to preparers who cannot use it?", "b": "Their MPL stays 2 while the price falls to $80, so MRPL falls from $200 to $160 and their labor demand shifts in."}, {"u": "02-inequality", "t": "Inequality", "f": "What is the race between education and technology?", "b": "Skill-biased technology raises inequality and education lowers it. They balanced in the 1950s and 1960s; around 1970 education slowed and technology won."}, {"u": "02-inequality", "t": "Inequality", "f": "How does more education show up on the two-market graph?", "b": "High-skill supply shifts out (wage falls) and low-skill supply shifts in (wage rises), so the gap shrinks."}, {"u": "02-inequality", "t": "Inequality", "f": "How does globalization affect the two labor markets?", "b": "Prices of high-skill export goods rise, so high-skill demand shifts out; prices of low-skill import-competing goods fall, so low-skill demand shifts in."}, {"u": "02-inequality", "t": "Inequality", "f": "Why does the U.S. export high-skill goods and import low-skill goods?", "b": "It has a comparative advantage in goods using high-skilled labor and a comparative disadvantage in goods using low-skilled labor."}, {"u": "02-inequality", "t": "Inequality", "f": "A tariff raises the domestic price of goods made with low-skilled labor. What happens to those U.S. workers' labor demand?", "b": "MR rises, so MRPL rises and their labor demand shifts out. Consumers pay through higher prices."}, {"u": "02-inequality", "t": "Inequality", "f": "What is the superstar effect?", "b": "Computers and mass communication let top entertainers, artists, inventors, and entrepreneurs reach huge markets and reap huge rewards."}, {"u": "02-inequality", "t": "Inequality", "f": "What imperfect-labor-market explanations does he give?", "b": "Employers with market power can pay less than MRPL, and U.S. union power has declined."}, {"u": "02-inequality", "t": "Inequality", "f": "What happened to private-sector union membership?", "b": "It rose to roughly a third of workers in the 1950s and fell to well under 10% by 2019."}, {"u": "02-inequality", "t": "Inequality", "f": "What happened to the inflation-adjusted federal minimum wage?", "b": "It peaked in the late 1960s and has drifted down since."}, {"u": "02-inequality", "t": "Inequality", "f": "What does the EPI chart say about CEO pay?", "b": "The CEO-to-worker compensation ratio was about 20 in 1965, peaked at 386.4 in 2000, and was 278.1 in 2018."}, {"u": "02-inequality", "t": "Inequality", "f": "What are his three broad categories of remedies?", "b": "Education and job training; policies for specific groups hurt by technology or trade; and policies that raise incomes at the bottom directly."}, {"u": "02-inequality", "t": "Inequality", "f": "What does Heckman argue about education?", "b": "Returns on investing in disadvantaged children are highest at the earliest ages, so early childhood education has the highest returns. But it won't change inequality quickly."}, {"u": "02-inequality", "t": "Inequality", "f": "What is Trade Adjustment Assistance, and his verdict?", "b": "Training, job search help, extra unemployment benefits, and temporary wage subsidies for workers who lose jobs to trade. His verdict: tiny and not used much."}, {"u": "02-inequality", "t": "Inequality", "f": "What are place-based policies?", "b": "Tax benefits, subsidies, and incentives to bring employers into a troubled area, plus funds for job training suited to local employers."}, {"u": "02-inequality", "t": "Inequality", "f": "Name three policies that raise incomes at the bottom directly.", "b": "The minimum wage, the Earned Income Tax Credit, and direct cash payments like a universal basic income."}, {"u": "02-inequality", "t": "Inequality", "f": "How does the EITC appear on the labor market graph?", "b": "Labor supply shifts down by the credit. Employment rises, employers pay a lower wage, and workers receive the lower wage plus the credit, which is more than before."}, {"u": "02-inequality", "t": "Inequality", "f": "D: W = 30 - 2L, S: W = 6 + 2L, EITC $4. Find L, the employer wage, and take-home pay.", "b": "Supply becomes W = 2 + 2L, so L = 7, employers pay $16, and workers receive $20."}, {"u": "02-inequality", "t": "Inequality", "f": "Minimum wage versus EITC: which raises employment?", "b": "The EITC raises employment; a binding minimum wage lowers it and creates unemployment."}, {"u": "02-inequality", "t": "Inequality", "f": "Who pays for the EITC and who pays for a minimum wage?", "b": "Taxpayers fund the EITC. Employers pay a minimum wage through higher wages."}, {"u": "02-inequality", "t": "Inequality", "f": "What did Card find about Miami wage inequality after the boatlift?", "b": "No obvious effect on wage inequality among non-Cubans in Miami; the top-to-bottom quartile gap was 0.84 in 1979 and 0.87 in 1985."}, {"u": "02-inequality", "t": "Inequality", "f": "Miami Black workers' log wages went 1.59 to 1.60 from 1979 to 1985; comparison cities 1.74 to 1.65. What does that show?", "b": "Miami rose 0.01 while comparison cities fell 0.09, so there is no sign the boatlift lowered these workers' wages."}, {"u": "02-inequality", "t": "Inequality", "f": "Why care about rising inequality, according to his slides?", "b": "Inequality and poverty are often correlated, both damage people and the economy, and rising inequality may hurt social cohesion and democracy."}, {"u": "02-inequality", "t": "Inequality", "f": "What are deaths of despair, and what did Case and Deaton find?", "b": "Deaths from drugs, alcohol, or suicide. For U.S. white non-Hispanics aged 50 to 54 they more than doubled from 1990 to 2014, far more than in other rich countries."}, {"u": "02-inequality", "t": "Inequality", "f": "Who won the 2025 Nobel in economics, and for what?", "b": "Joel Mokyr, Philippe Aghion, and Peter Howitt, for work on economic growth; Aghion and Howitt modeled growth as creative destruction."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "What does 'capital' mean in economics (Fall 2025 final Q1(c))?", "b": "All of the above: productive physical assets, financial assets, and accumulated savings that can be invested across borders."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "What is physical capital?", "b": "Man-made aids to production such as machines, buildings, trucks, and computers."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "What is financial capital?", "b": "The funds used to purchase, rent, or build physical capital."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "What is investment?", "b": "Spending on new capital: the flow of new capital into the capital stock. It is the I in C + I + G + NX."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "What is the formula for the marginal revenue product of capital?", "b": "MRPK = MR × MPK: marginal revenue times the marginal product of capital, the extra revenue one more machine brings in."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "Why does the demand curve for rental capital slope down?", "b": "Because MPK falls as more machines are used, so MRPK falls too. Demand for rental capital is the MRPK curve."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "Rental capital supply is vertical. Demand for the output rises. What happens in the rental market?", "b": "Higher output prices raise MR, so MRPK shifts right. The rental price rises and the quantity of capital stays the same."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "What is time preference?", "b": "People prefer things today to things tomorrow, which is why banks must pay interest on deposits."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "Define present value.", "b": "What a payment to be received in the future is worth to you today. Also called present discounted value."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "What is the formula for the present value of one future payment?", "b": "PV = F ÷ (1 + i)^t, where F is the payment, i the interest rate as a decimal, and t the years until it arrives."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "PV of $100 one year from now at 3%?", "b": "100 ÷ 1.03 = $97.09."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "PV of $100 one year from now at 8%?", "b": "100 ÷ 1.08 = $92.59."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "PV of $100 two years from now at 3%?", "b": "100 ÷ 1.03^2 = 100 ÷ 1.0609 = $94.26."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "PV of $1,000 at the end of each of the next three years at 3%?", "b": "970.87 + 942.60 + 915.14 = $2,828.61. The Fall 2025 slide shows $2,827.83 because of a typo in the first term."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "What is the formula for the present value of a stream of payments?", "b": "PV = F1 ÷ (1 + i) + F2 ÷ (1 + i)^2 + ... + Ft ÷ (1 + i)^t. Each payment is discounted by its own number of years."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "The interest rate rises. What happens to the price of a bond with fixed payments?", "b": "It falls. The payments are fixed and every denominator (1 + i)^t gets bigger, so the present value falls."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "Why does an old bond lose value when interest rates rise (intuition)?", "b": "New bonds now pay more, so nobody will pay full price for the old bond's smaller payments. It sells only at a lower price."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "What is the price of a three-year bond when i = 0?", "b": "PV = F1 + F2 + F3. With 1 + i = 1, every denominator is 1, so you just add the payments."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "Price of a bond paying $100 a year for 3 years at 0%, 5%, and 10%?", "b": "$300, $272.32, and $248.69."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "What determines the price of a unit of capital?", "b": "The present value of its future MRPKs: MRPK1 ÷ (1 + i) + MRPK2 ÷ (1 + i)^2 + ..., with MRPKt = MRt × MPKt."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "How is a machine different from a bond in the PV formula?", "b": "A bond's payments are fixed. A machine's payments are its MRPKs, which change when expected output prices (MR) or productivity (MPK) change."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "Capital's future marginal product falls, for example because less labor is expected. What happens to the price of capital (Fall 2025 Q2(e))?", "b": "It falls. Lower future MPK lowers future MRPK = MR × MPK, which pulls down the present value and the price."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "The future price of a firm's output is expected to rise. What happens to the price of its machines?", "b": "It rises, because higher MR raises future MRPK and so the present value."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "When does a profit-maximizing firm buy a machine?", "b": "When the PV of the machine's future MRPKs is at least its price. Firms buy machines up to where PV equals the price."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "Oven costs $2,500, adds $1,000 a year for 3 years. Buy at 5%? At 10%?", "b": "At 5% PV = $2,723.25, so buy. At 10% PV = $2,486.85, so do not buy."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "Why does the investment demand curve slope down?", "b": "A higher interest rate erodes the present value of machines' MRPKs, so fewer machines are worth their price and firms buy fewer."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "What are the axes of the investment demand curve?", "b": "Interest rate i on the vertical axis, investment I on the horizontal axis. The curve slopes down."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "The interest rate falls. Shift or movement along the investment demand curve?", "b": "A movement along the curve to more investment, because i is on the vertical axis."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "What does an investment tax credit do to investment demand?", "b": "Shifts it right. It lowers the effective price of machines, so more are worth buying at every interest rate."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "What does pessimism about future MRPK do to investment demand?", "b": "Shifts it left. Lower expected MRPKs lower every machine's PV, so firms invest less at every interest rate."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "What sets a stock's price?", "b": "The present value of its stream of expected future dividends."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "Why do lower interest rates tend to raise stock prices?", "b": "Lower rates raise the present value of any dividend stream, and they tend to raise expected economic activity and so expected dividends."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "What happens to a stock price when people expect lower future dividends?", "b": "It falls, because the price is the PV of expected dividends."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "How do bonds and stocks differ as ways to raise financial capital?", "b": "Bonds borrow money with a promise to repay with interest. Stocks sell shares that entitle owners to a share of future profits (dividends)."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "What is the real interest rate (textbook)?", "b": "The nominal interest rate minus inflation, r = i − π. For example, 6% nominal with 4% inflation is a 2% real rate."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "Is $1,100 in two years worth more than $1,000 today at 5%? At 4%?", "b": "At 5% it is worth $997.73 today, so take the $1,000. At 4% it is worth $1,017.01, so wait."}, {"u": "03-capital", "t": "Capital, interest, and present value", "f": "What happens to PV when the payment is further in the future?", "b": "It falls, because the payment is divided by (1 + i) once more for every extra year of waiting."}, {"u": "04-trade", "t": "Gains from international trade", "f": "Define comparative advantage.", "b": "A producer has a comparative advantage in a good if it is the low-opportunity-cost producer of that good."}, {"u": "04-trade", "t": "Gains from international trade", "f": "How does absolute advantage differ from comparative advantage?", "b": "Absolute advantage means producing more per worker. Comparative advantage means a lower opportunity cost, and it decides who specializes."}, {"u": "04-trade", "t": "Gains from international trade", "f": "What does the principle of comparative advantage imply (Fall 2025 Q1(b))?", "b": "I should specialize in doing the task that I do best, meaning best relative to my other tasks, where my opportunity cost is lowest."}, {"u": "04-trade", "t": "Gains from international trade", "f": "How do you compute the opportunity cost of 1 unit of X from output per worker?", "b": "Divide units of Y per worker by units of X per worker. The opportunity cost of Y is the reciprocal."}, {"u": "04-trade", "t": "Gains from international trade", "f": "Edwards' example: U.S. worker 2 tons of soybeans or 2 washing machines; China 1 ton or 2 machines. Opportunity cost of a ton?", "b": "U.S.: 1 washing machine. China: 2 washing machines. So the U.S. has the comparative advantage in soybeans."}, {"u": "04-trade", "t": "Gains from international trade", "f": "Same example: opportunity cost of a washing machine?", "b": "U.S.: 1 ton of soybeans. China: ½ ton. So China has the comparative advantage in washing machines."}, {"u": "04-trade", "t": "Gains from international trade", "f": "What is factor abundance?", "b": "A country tends to have a comparative advantage in goods that use the inputs (factors) it has in abundance."}, {"u": "04-trade", "t": "Gains from international trade", "f": "Give Edwards' examples of factor abundance.", "b": "Minerals and early U.S. industrialization, climate and soil for coffee, capital and skilled labor for the U.S. today, and less-skilled labor for low-tech manufacturing in many developing countries."}, {"u": "04-trade", "t": "Gains from international trade", "f": "What is dynamic comparative advantage?", "b": "Comparative advantage that is acquired: by doing something or getting an early start, a country becomes the low-opportunity-cost producer."}, {"u": "04-trade", "t": "Gains from international trade", "f": "What is the slope of a PPC with soybeans across and washing machines up?", "b": "Minus the opportunity cost of soybeans in machines. U.S. −1, China −2."}, {"u": "04-trade", "t": "Gains from international trade", "f": "Define the terms of trade.", "b": "The relative price of a country's exports: how many units of imports one unit of exports buys. Also called the world relative price."}, {"u": "04-trade", "t": "Gains from international trade", "f": "Soybeans $400 a ton, washing machines $300. U.S. terms of trade?", "b": "P_S ÷ P_WM = 400 ÷ 300 = 1⅓ washing machines per ton of soybeans."}, {"u": "04-trade", "t": "Gains from international trade", "f": "Soybeans $400, washing machines $300. China's terms of trade?", "b": "The reciprocal: 300 ÷ 400 = ¾ ton of soybeans per washing machine, since China exports machines."}, {"u": "04-trade", "t": "Gains from international trade", "f": "When will both countries want to trade?", "b": "When the terms of trade lie between the two countries' opportunity costs. In the example, between 1 and 2 washing machines per ton."}, {"u": "04-trade", "t": "Gains from international trade", "f": "Soybeans $200, washing machines $300. What happens?", "b": "A ton buys only ⅔ machine, below the U.S. cost of 1. China wants to buy but the U.S. will not sell, so excess demand pushes the relative price of soybeans up."}, {"u": "04-trade", "t": "Gains from international trade", "f": "A ton of soybeans trades for 2½ machines in the example. What happens?", "b": "That is above China's cost of 2, so China will not buy. Excess supply pushes the relative price of soybeans down."}, {"u": "04-trade", "t": "Gains from international trade", "f": "Who gets the gains from trade when the terms of trade equal one country's opportunity cost?", "b": "The other country gets all of them. At 1 machine per ton the U.S. gains nothing; at 2, China gains nothing."}, {"u": "04-trade", "t": "Gains from international trade", "f": "What is the consumption possibilities curve (CPC)?", "b": "The combinations of the two goods a country can have with trade. It starts at the specialized production point and has slope equal to minus the terms of trade."}, {"u": "04-trade", "t": "Gains from international trade", "f": "U.S. CPC at 1⅓ machines per ton (U.S. worker: 2 tons or 2 machines)?", "b": "From 2 tons of soybeans up to 2⅔ washing machines, slope −1⅓."}, {"u": "04-trade", "t": "Gains from international trade", "f": "China CPC at 1⅓ machines per ton (China worker: 1 ton or 2 machines)?", "b": "From 2 washing machines out to 1½ tons of soybeans, slope −1⅓."}, {"u": "04-trade", "t": "Gains from international trade", "f": "How are the gains from trade shown on a graph?", "b": "The CPC lies outside the PPC."}, {"u": "04-trade", "t": "Gains from international trade", "f": "A U.S. worker keeps 1 ton and trades 1 ton at 1⅓. What does she gain?", "b": "She has 1⅓ machines instead of the 1 machine she could make without trade, a gain of ⅓ machine."}, {"u": "04-trade", "t": "Gains from international trade", "f": "What happens to the U.S. CPC when the U.S. terms of trade worsen?", "b": "It pivots in around the production point. If the terms of trade fall to the U.S. opportunity cost, the CPC sits on the PPC and the gains vanish."}, {"u": "04-trade", "t": "Gains from international trade", "f": "Why do straight-line PPCs lead to complete specialization?", "b": "A line with slope minus the terms of trade touches a straight PPC only at an endpoint, so each country produces only one good."}, {"u": "04-trade", "t": "Gains from international trade", "f": "Why is a real country's PPC curved?", "b": "Opportunity cost rises as a country produces more of a good, because it switches its best-suited resources first."}, {"u": "04-trade", "t": "Gains from international trade", "f": "With a curved PPC, where does a country produce?", "b": "At the tangency point A, where the PPC's slope equals minus the terms of trade. That output has the largest value in world markets."}, {"u": "04-trade", "t": "Gains from international trade", "f": "With a curved PPC, where does a country consume?", "b": "At a point B on the CPC outside the PPC. It exports the good it makes more of than it consumes and imports the other."}, {"u": "04-trade", "t": "Gains from international trade", "f": "Does everyone in a country gain from trade?", "b": "No. The country gains overall, but import-competing producers and workers lose. Exporters and buyers of imports gain."}, {"u": "04-trade", "t": "Gains from international trade", "f": "What did the U.S. government pay soybean farmers in the first Trump term, per Edwards' slide?", "b": "$23 billion, after Chinese soybean imports plummeted."}, {"u": "04-trade", "t": "Gains from international trade", "f": "What did the Fall 2025 final Q4(d) key conclude about the 2025 soybean trade war?", "b": "The U.S. lost and China won: the U.S. had to compensate its farmers, while China's durable goods found new buyers and it reported a record trade surplus."}, {"u": "04-trade", "t": "Gains from international trade", "f": "What two problems arise in using a trade and growth correlation?", "b": "Reverse causation (being rich may cause more trade) and omitted influences (free traders may also adopt other growth-friendly policies)."}, {"u": "04-trade", "t": "Gains from international trade", "f": "How did Frankel and Romer address those problems?", "b": "They used the part of trade predicted by geography, which income cannot cause, and still found it positively associated with income per worker."}, {"u": "04-trade", "t": "Gains from international trade", "f": "What did Dollar and Kraay find about 'globalisers'?", "b": "Developing countries that opened to trade from the late 1970s to the 1980s grew substantially more afterward."}, {"u": "04-trade", "t": "Gains from international trade", "f": "What did Sachs and Warner compare?", "b": "Eight always-open and forty always-closed economies from 1966 to 1990; the open ones grew faster over most of the period."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "On a domestic supply and demand graph, how do you tell whether a good is exported or imported?", "b": "Compare the world price with the no-trade price where domestic S meets D. A world price above it means exports; a world price below it means imports."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "How do you measure exports on the graph?", "b": "At the world price, find quantity supplied (on S) and quantity demanded (on D). Exports are the horizontal gap QS minus QD."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "How do you measure imports on the graph?", "b": "At a world price below the no-trade price, imports are the horizontal gap QD minus QS, both read at the world price."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "Why is the world price drawn as a horizontal line?", "b": "The country is a price taker: world demand and supply at that price are perfectly elastic, so it can buy or sell any amount without moving the price."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "D: P = 12 − Q, S: P = Q, world price $8. Find QD, QS, and exports.", "b": "QD = 4, QS = 8, exports = 4. The no-trade price is $6, so the world price is above it."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "D: P = 12 − Q, S: P = Q, world price $8. Find CS, PS, and the gain from trade.", "b": "CS = ½ × 4 × 4 = 8 (was 18). PS = ½ × 8 × 8 = 32 (was 18). Total rises from 36 to 40, a gain of 4."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "Who wins and who loses when a country starts exporting a good?", "b": "Domestic producers win (higher price, more sales). Domestic consumers lose (higher price). Producers gain more than consumers lose, so the country gains."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "Who wins and who loses when a country starts importing a good?", "b": "Domestic consumers win (lower price). Domestic producers lose. Consumers gain more than producers lose, so the country gains."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "What shape is the gain from trade on the graph?", "b": "A triangle between the world price line and the domestic S and D curves, with its point at the no-trade equilibrium."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "Fall 2025 final 4(b): the harvest is fixed, cannot be stored or destroyed, and China stops buying. Where does the price go?", "b": "Down to the height of the domestic demand curve at the harvested quantity QS. All of the harvest must be sold to domestic buyers, who take that much only at that low price."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "Soybeans: D: P = 12 − Q, harvest fixed at 8, exports vanish. New price?", "b": "P = 12 − 8 = $4, down from $8 and below the $6 no-trade price."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "Why does the trade-war price fall below the no-trade price?", "b": "The fixed harvest is larger than the no-trade quantity, because exporters were producing more than domestic buyers wanted. Selling that bigger quantity at home requires a price below the no-trade price."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "What happens to the trade-war price if other countries will buy at $7?", "b": "The price stops at $7, because no farmer sells at home for less. With D: P = 12 − Q and a harvest of 8, domestic buyers take 5 and 3 are exported."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "What happens the season after a trade war if exports stay gone and farmers can replant?", "b": "Quantity adjusts along the supply curve, so the market returns to the domestic equilibrium (6 units at $6 in the soybean example)."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "What would change in the soybean trade war if farmers could store soybeans for free?", "b": "They would hold back the unsold soybeans instead of dumping them, so the price would fall much less than to the demand curve at the full harvest."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "Trade war: what happens to labor demand for soybean workers, and why?", "b": "Labor demand MRPL = MR × MPL shifts down or inward because the soybean price (MR) fell. Wage and employment fall. MPL did not change."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "When a country opens to trade, what happens to labor demand in its export and import industries?", "b": "Export industry: the price rises, so MRPL shifts up. Import industry: the price falls, so MRPL shifts down. Jobs move between industries."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "Does trade raise or lower total employment?", "b": "Edwards: trade tends to rearrange jobs rather than raise or lower employment overall. The moves can be very painful for displaced workers."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "What was the China shock, and why did it hurt more than expected?", "b": "Import competition after China joined the WTO in 2001. The losses were concentrated in towns built on industries like furniture, with few college graduates, and those local labor markets did not recover."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "North Hickory vs Raleigh-Cary: which was hurt more by the China shock, and why?", "b": "North Hickory (−5.32 vs −3.84 in log income per capita impact). It depended heavily on furniture manufacturing and had few college graduates; Raleigh-Cary was larger and more diversified."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "Define tariff and quota.", "b": "A tariff is a tax on imports. A quota is a limit on the quantity of imports."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "What does a tariff of t do to the domestic price of an imported good?", "b": "It raises the domestic price from Pw to Pw + t. Domestic production rises, consumption falls, and imports shrink."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "In Edwards' tariff table, what are consumer surplus before and after?", "b": "Before: a+b+c+d+e+f. After: a+b. Consumers lose c+d+e+f."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "In Edwards' tariff table, what are producer surplus, revenue, and deadweight loss after the tariff?", "b": "Producer surplus c+g (gain c), tariff revenue e, deadweight loss d+f."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "What do tariff triangles d and f each represent?", "b": "d: units now made at home at a cost above the world price (wasted production). f: units buyers valued above the world price but no longer buy (lost consumption)."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "Formula for tariff revenue?", "b": "Tariff per unit × imports after the tariff: t × (QD2 − QS2)."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "D: P = 20 − Q, S: P = Q, Pw = 4, tariff 2. Imports before and after, revenue, DWL?", "b": "Imports 12 before (16 − 4), 8 after (14 − 6). Revenue 2 × 8 = 16. DWL ½ × 2 × 2 + ½ × 2 × 2 = 4."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "Same tariff example: how much do consumers lose and producers gain?", "b": "Consumers lose 30 (128 to 98). Producers gain 10 (8 to 18). Government gets 16. Net loss 4."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "What is a prohibitive tariff?", "b": "A tariff that lifts Pw + t to the no-trade price or higher, so imports and tariff revenue both fall to zero. With Pw = 4 and a no-trade price of 10, any tariff of 6 or more."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "How does a quota compare with a tariff that allows the same imports?", "b": "Same domestic price, production, consumption, and deadweight loss triangles. The rectangle e becomes quota rent for import-license holders instead of government revenue."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "What quota matches a $2 tariff when D: P = 20 − Q, S: P = Q, Pw = 4?", "b": "A quota of 8: at a price of 6, demand 14 minus domestic supply 6 is 8."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "Employment effects of a tariff (Edwards, slide 45)?", "b": "Likely raises employment in the protected industry but probably not total employment. Retaliation can cut foreign demand, currencies may move, and other industries can be hurt."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "List Edwards' possible arguments for protection.", "b": "National security, supply chain disruptions, diversification, infant industry or dynamic comparative advantage, jobs for particular workers, and positive domestic externalities from domestic production."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "How does a foreign retaliatory tariff look on the exporter's graph?", "b": "As a lower price received by exporters: the effective world price line drops, so exports, producer surplus, and the gain from trade shrink while domestic consumers gain a little."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "Fall 2025 final 4(d): who won the 2025 soybean round, and why?", "b": "The U.S. lost and China won. The U.S. paid farmers $12 billion to compensate them; China's durable manufactured goods could wait for new buyers and it reported a record trade surplus."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "What links the PPC/CPC picture to the supply and demand trade graph?", "b": "Where the world price meets domestic S is the production point (tangency A on the PPC); where it meets domestic D is the consumption point (B on the CPC)."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "What are the terms of trade in Edwards' soybean and washing machine example?", "b": "Soybeans $400, washing machines $300, so 1⅓ washing machines per ton of soybeans."}, {"u": "05-trade-policy", "t": "Trade in supply and demand: exports, imports, tariffs", "f": "Besides trade policy, what else determines how much countries trade?", "b": "Shipping costs, logistics (the 1950s container ship cut out the stevedores), and communication that makes trade in services possible."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Define GDP.", "b": "The market value of the final goods and services newly produced in a country during some period of time."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "What are the four key points in the GDP definition?", "b": "Final goods and services, newly produced, within the country, in some period of time."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "What are the three approaches to measuring GDP?", "b": "Expenditure (C + I + G + NX), production or value added (sum each stage's sales minus its inputs), and income (labor income plus capital income)."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Write the expenditure identity.", "b": "Y = C + I + G + NX, where NX = EX − IM."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Why are imports subtracted in Y = C + I + G + NX?", "b": "C, I, and G already include spending on foreign-made goods. Subtracting imports removes them so GDP counts only domestic production."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "A household buys a $1,000 imported TV. What happens to GDP?", "b": "Nothing. C rises by $1,000 and imports rise by $1,000, so NX falls by $1,000 and they cancel."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Is buying shares of stock 'investment' in GDP?", "b": "No. In GDP, investment means spending on new capital goods, new housing, and inventories. Buying stock just moves ownership of an existing asset."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Are Social Security or SNAP benefits part of G?", "b": "No. They are transfer payments: the government buys no good or service. They enter GDP through C when spent."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Does a used car sale count in GDP?", "b": "Only the dealer's markup counts, because it is a new service. The car itself was produced in an earlier year."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Does a Toyota built in Kentucky count in U.S. GDP?", "b": "Yes. GDP counts production within the country regardless of who owns the firm."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "A car is built in December but sold next year. When does it count in GDP?", "b": "This year, as inventory investment. Next year the sale raises C and lowers inventories by the same amount."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Why does cleaning your own house not count in GDP?", "b": "It has no market transaction or price. If you hire a housekeeper, the same work counts."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Wheat sold for $1, flour for $1.50, bread for $3. How much does GDP rise?", "b": "$3, the final price, which equals the sum of value added: $1 + $0.50 + $1.50."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "What do 'nominal' and 'real' mean?", "b": "Nominal: measured in current dollars. Real: adjusted for price changes, measured in goods and services rather than dollars."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Formula for real GDP in 2022 with base year 2012?", "b": "Sum over goods of 2012 prices times 2022 quantities: what 2022 output would have been worth at 2012 prices."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "What does real GDP hold fixed, and what does the CPI hold fixed?", "b": "Real GDP holds base-year prices fixed and uses current quantities. The CPI holds base-year quantities fixed and uses current prices."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Formula for the GDP deflator?", "b": "Nominal GDP ÷ real GDP × 100. It is 100 in the base year."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Formula for the CPI?", "b": "Cost of the base-year basket at this year's prices ÷ cost of the same basket at base-year prices × 100. The base-year quantities are the weights."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Formula for the inflation rate?", "b": "(Index this year − index last year) ÷ index last year × 100. Negative inflation is deflation."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "The CPI goes from 300 to 309. Inflation?", "b": "9 ÷ 300 = 3%."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Nominal GDP grows 7% and prices rise 3%. Real growth?", "b": "About 4% (nominal growth minus inflation). Exactly 1.07 ÷ 1.03 − 1 = 3.9%."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Formula to convert $X in year A into year B dollars?", "b": "$X_B = $X_A × (P_B ÷ P_A), where P is the price index. Equivalently, $X_B ÷ P_B = $X_A ÷ P_A."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Fall 2025 final 2(a): Big Mac $1.60 (1986) to $5.65 (2021); CPI 110 to 271. Did the real price rise?", "b": "Yes. The Big Mac rose by a factor of about 3.5 while the CPI rose by about 2.5, so the real price increased; with income that kept up with inflation you could buy fewer."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "What is the 1986 Big Mac ($1.60) worth in 2021 dollars?", "b": "$1.60 × 271 ÷ 110 = $3.94, well below the actual $5.65."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "By how much did the real price of a Big Mac rise from 1986 to 2021?", "b": "About 43%: 5.65 ÷ 3.94 = 1.43, or 3.53 ÷ 2.46 = 1.43."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Quick rule: when did an item's real price rise?", "b": "When its price grew by a bigger factor than the price index. Same factor: real price unchanged. Smaller factor: real price fell."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Cal in-state tuition was $1,296 in 1985 to 1986 (CPI 108.94). What is that in today's dollars (CPI 300.536)?", "b": "$1,296 × 300.536 ÷ 108.94 = $3,575. Actual tuition and fees are $14,796, so real tuition is much higher."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "A desktop cost $4,000 in 1996 (CPI 156.85). In today's dollars (CPI 300.536)?", "b": "$4,000 × 300.536 ÷ 156.85 = $7,664. Today a good desktop is about $1,000, so the real price fell a lot."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Why did the real price of a Big Mac rise while computers got cheaper?", "b": "A Big Mac needs workers and a restaurant and cannot be automated much (final 2(b)), so its marginal cost does not fall. Factory goods like computers get cheaper as automation and technology cut marginal cost."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "How does the BLS handle quality changes in the CPI?", "b": "It tries to remove the part of a price increase due to better quality and counts only the rest as inflation. It also tries to account for new goods."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Are Laspeyres, Paasche, and Fisher indexes on the exam?", "b": "No. Edwards' slide: the details of measuring inflation when the basket changes won't be on the exam."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Edwards' three arguments for caring about inflation?", "b": "Redistribution, psychology, and efficiency."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "What is indexing? Example?", "b": "Automatically raising a payment with the price index. A $1,500 benefit with the CPI going from 300 to 309 becomes $1,545."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "$20 an hour at CPI 200, $28 an hour at CPI 250. Did the real wage rise?", "b": "Yes, by 12%: $10.00 vs $11.20 in base-year dollars."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Define the labor force and the unemployment rate.", "b": "Labor force = employed + unemployed. Unemployment rate = unemployed ÷ labor force × 100."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Who counts as unemployed?", "b": "Someone without work who is available and actively looked for a job in the past four weeks. Students, retirees, and discouraged workers are not in the labor force."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "250 million adults, 152 million employed, 8 million unemployed. Unemployment and participation rates?", "b": "Labor force 160 million. Unemployment rate 5.0%. Participation 64%."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "What happens to the unemployment rate when discouraged workers stop looking?", "b": "It falls, because they leave the labor force, even though no one found a job. Example: 8 ÷ 160 = 5.0% becomes 6 ÷ 158 = 3.8%."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Why can't you compare China's ¥134,908 billion GDP with U.S. $29,298 billion directly?", "b": "Different currency units. The IMF uses PPP international dollars, valuing both at common prices: China about $38,210 billion and the U.S. about $29,300 billion in 2024."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "U.S. GDP and GDP per person on his slides?", "b": "About $30 trillion for 340 million people, about $88,000 per person."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "What is potential output Y*?", "b": "The output the economy produces when using its resources at normal rates. Edwards says 'normal output' might be a better name."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Decompose potential output per person.", "b": "Y* ÷ POP = (Y* ÷ N*) × (N* ÷ POP): average labor productivity times the employment-to-population ratio. Productivity depends on capital per worker and technology."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "If A grows 1 point a year faster than B, how much richer is A after 70 and 200 years?", "b": "About twice as rich after 70 years (1.01^70 ≈ 2) and about 7.3 times after 200 years."}, {"u": "06-measurement", "t": "GDP, prices, and unemployment", "f": "Real interest rate formula (textbook)?", "b": "r = i − π: the nominal interest rate minus inflation. A 5% loan with 3% inflation has a 2% real rate."}, {"u": "07-growth", "t": "Long-run growth", "f": "What is the growth rate formula?", "b": "Growth rate = (this year's value − last year's value) ÷ last year's value. From $50,000 to $51,500 is 1,500 ÷ 50,000 = 3%."}, {"u": "07-growth", "t": "Long-run growth", "f": "What is the compounding formula for income after t years?", "b": "Y_t = Y_0 × (1 + g)^t, with g as a decimal. $10,000 at 2% for 70 years is 10,000 × 1.02^70 ≈ $40,000."}, {"u": "07-growth", "t": "Long-run growth", "f": "What is the rule of 70?", "b": "Years to double ≈ 70 ÷ the growth rate in percent. At 2% a year, income doubles in about 35 years."}, {"u": "07-growth", "t": "Long-run growth", "f": "About how long does income take to double at 3.5% a year?", "b": "About 70 ÷ 3.5 = 20 years."}, {"u": "07-growth", "t": "Long-run growth", "f": "What is the common rule-of-70 mistake?", "b": "Dividing by the decimal (70 ÷ 0.02 = 3,500). Use the percent number: 70 ÷ 2 = 35."}, {"u": "07-growth", "t": "Long-run growth", "f": "If country A grows 1 point faster than B, how much richer is A after 70 years?", "b": "About twice as rich, because 1.01^70 ≈ 2. After 200 years it is more than 7 times as rich (1.01^200 ≈ 7.3)."}, {"u": "07-growth", "t": "Long-run growth", "f": "Income rises 21% over 2 years. What is the average yearly growth rate?", "b": "10% a year, because 1.1 × 1.1 = 1.21. Growth compounds, so it is not 10.5%."}, {"u": "07-growth", "t": "Long-run growth", "f": "How do you split potential output per person into two pieces?", "b": "Y*/POP = (Y*/N*) × (N*/POP): average labor productivity times the employment-to-population ratio."}, {"u": "07-growth", "t": "Long-run growth", "f": "What is average labor productivity?", "b": "Output per employed worker, Y*/N*."}, {"u": "07-growth", "t": "Long-run growth", "f": "What does average labor productivity depend on, per his slides?", "b": "Y*/N* = f(K*/N*, T): normal capital per worker (physical and human) and technology."}, {"u": "07-growth", "t": "Long-run growth", "f": "What is potential output Y*?", "b": "The amount of output the economy produces when it uses its resources at normal rates. Edwards says a better name might be normal output."}, {"u": "07-growth", "t": "Long-run growth", "f": "What are the determinants of average labor productivity?", "b": "Physical capital, human capital, and technology on his slides; the textbook adds natural resources and entrepreneurship. Social infrastructure (institutions) underlies all of them."}, {"u": "07-growth", "t": "Long-run growth", "f": "What is human capital?", "b": "The education and job training of workers. It counts as capital because it was built in the past and helps production now."}, {"u": "07-growth", "t": "Long-run growth", "f": "What counts as physical capital?", "b": "Machines, buildings, computers, and infrastructure such as roads, telecommunications systems, and dams."}, {"u": "07-growth", "t": "Long-run growth", "f": "How broadly do his slides define technology?", "b": "Everything that affects output per worker for a given capital per worker: production techniques, management techniques, economic institutions, and local culture."}, {"u": "07-growth", "t": "Long-run growth", "f": "Which three items make up social infrastructure on his slides?", "b": "The rule of law, property rights, and protection from government. On the Fall 2025 final the answer was all of the above."}, {"u": "07-growth", "t": "Long-run growth", "f": "What are the three key features of institutions that raise output per person?", "b": "A market-based system for allocating resources, government protection of property from others, and protection of property from government corruption, theft, and arbitrary taxation."}, {"u": "07-growth", "t": "Long-run growth", "f": "What are diminishing returns to capital?", "b": "With workers and technology fixed, each extra unit of capital adds less output than the one before. Doubling K*/N* less than doubles Y*/POP."}, {"u": "07-growth", "t": "Long-run growth", "f": "Why can't capital accumulation alone sustain growth?", "b": "Diminishing returns: each round of investment buys a smaller gain in output. Lasting growth needs technology, which shifts the production function up."}, {"u": "07-growth", "t": "Long-run growth", "f": "On a production function graph, how do more capital and better technology differ?", "b": "More capital is a move along the flattening curve. Better technology shifts the whole curve up, so the same capital produces more."}, {"u": "07-growth", "t": "Long-run growth", "f": "Why can't a rising employment-to-population ratio drive long-run growth?", "b": "It does not change much, it cannot rise above 1, and with fixed capital each new worker has less capital, so output per person rises less than proportionally."}, {"u": "07-growth", "t": "Long-run growth", "f": "Per his slides, what explains most growth over time in rich countries?", "b": "Technology, perhaps 2/3 of overall growth. Capital per worker is somewhat important; the employment ratio is not very important."}, {"u": "07-growth", "t": "Long-run growth", "f": "Per his slides, what explains income differences across countries?", "b": "Capital per worker and technology, each about half. The key technology difference is institutions and culture, not knowledge."}, {"u": "07-growth", "t": "Long-run growth", "f": "What shifts labor demand out in the long run?", "b": "Anything that raises MRPL = P × MPL: more physical or human capital, better technology, or trade raising the export price."}, {"u": "07-growth", "t": "Long-run growth", "f": "What can permanently raise wages and employment?", "b": "Only permanent outward shifts in labor demand. Large enough shifts can even absorb population growth and keep wages rising."}, {"u": "07-growth", "t": "Long-run growth", "f": "What is the Malthusian trap?", "b": "The long stretch of history with stagnant population, income, disease, and death, in which income per person barely grew."}, {"u": "07-growth", "t": "Long-run growth", "f": "What did England's real wages and population show from 1250 to 1450?", "b": "They moved in opposite directions along one downward-sloping line: a static labor demand curve. When plague cut population, wages rose."}, {"u": "07-growth", "t": "Long-run growth", "f": "What changed around 1800 in England?", "b": "Population and real wages started rising together, which means labor demand was shifting out."}, {"u": "07-growth", "t": "Long-run growth", "f": "Does the free market produce enough invention?", "b": "Almost certainly not, because inventions have large positive externalities, especially basic science. So the market produces too little."}, {"u": "07-growth", "t": "Long-run growth", "f": "Which policies encourage technological progress, per his slides?", "b": "Increase education, subsidize research and development (especially basic science), make property rights more secure, and improve institutions."}, {"u": "07-growth", "t": "Long-run growth", "f": "How do you convert a dollar amount into another year's dollars?", "b": "Multiply by the ratio of price indexes: $X_B = $X_A × (P_B ÷ P_A)."}, {"u": "07-growth", "t": "Long-run growth", "f": "How do you tell if a real price rose?", "b": "Compare the item's growth factor with the CPI's. The Big Mac rose 3.5 times and the CPI 2.5 times, so its real price rose."}, {"u": "07-growth", "t": "Long-run growth", "f": "Why is GDP per person (,000) higher than a typical annual wage (,000)?", "b": "GDP per person is average total income, which includes capital income such as dividends and interest. The two tend to grow at the same rate in the long run."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "What is an output gap?", "b": "Actual output minus potential output, Y − Y*, often stated as a percent of Y*."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "What is a recessionary gap?", "b": "Output below potential (Y < Y*). Resources sit idle and unemployment is above its normal rate."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "What is an expansionary gap?", "b": "Output above potential (Y > Y*). The economy runs hotter than normal, and inflation tends to rise over time."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "What is cyclical unemployment?", "b": "Unemployment above the natural rate, caused by output falling below potential."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "Why is output determined by demand in the short run?", "b": "Prices and wages are sticky (contracts, limited information, dislike of unfair price changes and wage cuts), so firms meet demand at fixed prices, like a restaurant serving whoever walks in."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "What is the relationship between nominal and real interest rates?", "b": "i = r + π, so r = i − π. With i = 10% and π = 9%, r = 1%."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "Why did the real interest rate soar in the early Great Depression?", "b": "Nominal rates fell, but prices collapsed, so π was negative and r = i − π rose."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "What is planned aggregate expenditure (PAE)?", "b": "Total planned spending by households, firms, and government: PAE = C + I^P + G + NX."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "What determines planned investment?", "b": "The real interest rate (higher r lowers it) and expectations about future demand (animal spirits)."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "What determines consumption?", "b": "Disposable income, wealth, expectations about future income (consumer confidence), and the real interest rate."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "What is the consumption function?", "b": "C = C̄ + mpc × (Y − T). C̄ is autonomous consumption; the mpc is the extra consumption from one more dollar of disposable income."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "What is the marginal propensity to consume (mpc)?", "b": "The change in consumption from a one-dollar change in disposable income, between 0 and 1. It is the slope of the PAE line."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "What is autonomous spending?", "b": "The part of PAE that does not depend on income: C̄ − mpc × T + I + G + NX. It is the vertical intercept of the PAE line."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "How do taxes enter autonomous spending?", "b": "As −mpc × T, not −T. C = 3 + 0.5(Y − 2) becomes 2 + 0.5Y."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "What does the 45° line show?", "b": "All points where output equals planned spending, Y = PAE. It starts at the origin with slope 1, so the axes must have equal scales."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "How do you solve for short-run equilibrium output?", "b": "Set Y = A + mpc × Y, so Y = A ÷ (1 − mpc). Fall 2025: 20 ÷ (2/3) = 30."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "Fall 2025 Q3: C = 10 + Y/3, I = 6, G = 5, NX = −1. What are the intercept and equilibrium?", "b": "PAE = 20 + Y/3, so the intercept is 20, and (2/3)Y = 20 gives Y = 30."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "Fall 2025 Q3 shock: C' = 8 + Y/3, I' = 5, G = 5, NX' = 0. What are the new intercept and equilibrium?", "b": "PAE' = 18 + Y/3, intercept 18, and (2/3)Y = 18 gives Y = 27."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "Fall 2025 Q3: how much did PAE and GDP change?", "b": "PAE fell  trillion (C̄ −2, I −1, NX +1). GDP fell  trillion, from 30 to 27."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "Why does GDP change more than PAE?", "b": "Because the mpc is above zero: lower spending lowers income, which lowers consumption, and so on. The multiplier is 1 ÷ (1 − mpc)."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "What is the multiplier formula, and what is it at mpc = 1/3, 0.5, 0.75, and 0.8?", "b": "1 ÷ (1 − mpc): 1.5, 2, 4, and 5."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "What change in G offsets a shock to PAE?", "b": "An equal and opposite change in G, the size of the change in PAE (not the change in GDP). Fall 2025: raise G by  trillion."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "How much must G change to close a recessionary gap?", "b": "The gap times (1 − mpc). A gap of 4 with mpc = 0.5 needs G up by 2."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "What happens when output is above PAE?", "b": "Unsold goods pile up as unplanned inventory investment, so firms cut production toward equilibrium."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "What happens when output is below PAE?", "b": "Inventories run down unexpectedly, so firms raise production toward equilibrium."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "How are actual and planned investment related?", "b": "Actual investment = planned investment + unplanned inventory investment (Y − PAE). They are equal only at equilibrium."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "What shifts the PAE line, and what does a shift look like?", "b": "Any change in autonomous spending (C̄, I, G, NX, or T) shifts it in parallel, keeping slope mpc. A change in Y is a movement along the line."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "What changes the slope of the PAE line?", "b": "Only a change in the marginal propensity to consume."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "Why can a stock market crash cut consumer spending?", "b": "Lost wealth makes people feel poorer, falling prices lower confidence, and volatility causes wait-and-see behavior. Autonomous consumption falls."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "After the 1929 crash, which spending fell and which held up?", "b": "Durable goods like autos and furniture collapsed, while groceries did not. The fall in demand then led to a fall in production."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "A  billion fall in investment with mpc = 0.8 changes GDP by how much?", "b": "Multiplier 1 ÷ (1 − 0.8) = 5, so GDP falls by  billion."}, {"u": "08-fluctuations", "t": "Recessions and the Keynesian cross", "f": "What happens in the long run, per his slides?", "b": "Output returns to potential Y*, set by capital, labor, and technology, and PAE adjusts to equal Y*."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "What is fiscal policy?", "b": "Tax rates, cash and other transfers, and direct government purchases of goods and services."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "What are net taxes T?", "b": "Taxes minus transfers back to households, such as Social Security benefits."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "What is disposable income?", "b": "Y − T: income minus net taxes. Households split it between consumption and saving."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "Write the consumption function with taxes.", "b": "C = C̄ + mpc × (Y − T). C̄ is autonomous consumption; mpc is the marginal propensity to consume."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "What is the intercept of the PAE line once government is included?", "b": "Autonomous spending: C̄ − mpc × T + I + G + NX. The slope is the mpc."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "Equilibrium output formula with taxes?", "b": "Y = (C̄ − mpc × T + I + G + NX) ÷ (1 − mpc)."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "By how much does a $100 billion increase in G raise PAE?", "b": "By $100 billion. G enters PAE one for one."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "By how much does a $100 billion tax cut raise PAE?", "b": "By mpc × $100 billion, because households save part of the tax cut."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "Spending multiplier?", "b": "1 ÷ (1 − mpc). With mpc 0.5 it is 2."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "Tax multiplier?", "b": "−mpc ÷ (1 − mpc). With mpc 0.5 it is −1. It is always 1 smaller in size than the spending multiplier."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "mpc = 0.8. Effects of $100 billion more G versus a $100 billion tax cut on output?", "b": "G raises output by 5 × 100 = $500 billion. The tax cut raises PAE by $80 billion and output by $400 billion."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "Fall 2025 final Q3(j): PAE fell by $2 trillion and GDP by $3 trillion. What change in G offsets it?", "b": "Raise G by $2 trillion, matching the drop in PAE. The multiplier then restores GDP by $3 trillion."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "To offset a PAE drop of 2 with taxes when mpc = 1/3, how big a tax cut?", "b": "2 ÷ (1/3) = 6. A tax cut moves PAE by only mpc per dollar."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "Three steps to close an output gap with fiscal policy?", "b": "Gap = Y* − Y. Needed ΔPAE = gap × (1 − mpc). Change G by ΔPAE, or change T by −ΔPAE ÷ mpc."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "Y = 28, Y* = 32, mpc = 0.5. What change in G closes the gap? What tax cut?", "b": "Needed ΔPAE = 4 × 0.5 = 2. Raise G by 2, or cut T by 2 ÷ 0.5 = 4."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "Y = 18, Y* = 20 (trillions), mpc = 0.8. G increase and tax cut needed?", "b": "ΔPAE = 2 × 0.2 = 0.4: raise G by $400 billion, or cut taxes by 0.4 ÷ 0.8 = $500 billion."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "What does a change in G or T do to the slope of PAE?", "b": "Nothing. G and T are in the intercept, so PAE shifts parallel; the slope stays the mpc."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "How do higher transfers (like unemployment benefits) affect PAE?", "b": "They lower net taxes T, so PAE rises by mpc × the transfer increase, like a tax cut."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "Balanced-budget change (textbook): G and T both rise by 1, mpc 0.5. Effect on Y?", "b": "ΔPAE = 1 − 0.5 = 0.5; ΔY = 0.5 × 2 = 1. The balanced-budget multiplier is 1."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "Government budget surplus?", "b": "T − G, tax revenues minus government purchases."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "Deficit versus debt?", "b": "The deficit is one year's spending above taxes. The debt is the accumulation of past deficits."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "Expansionary fiscal policy?", "b": "Actions that decrease the budget surplus (raise G or cut T). It raises PAE at a given Y."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "Contractionary fiscal policy?", "b": "Actions that increase the budget surplus (cut G or raise T). It lowers PAE at a given Y."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "Countercyclical fiscal policy?", "b": "Working against the business cycle: expansionary in a recession, contractionary in a boom."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "Output is above potential. What fiscal policy closes the gap?", "b": "Contractionary: cut G or raise T. Example: Y = 33, Y* = 30, mpc 2/3: cut G by 1 or raise T by 1.5."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "Three reasons from his slides to care about government debt?", "b": "It probably raises interest rates; if too high relative to GDP it could trigger a debt crisis; it is serviced rather than paid off, so future generations pay more."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "What does CBO estimate the July 2025 reconciliation law does to debt?", "b": "Raises debt held by the public by 9.5 percentage points of GDP at the end of 2034; his chart shows 127.5% in 2035 instead of 118%."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "What limits government borrowing?", "b": "Savers must buy the debt; states face balanced budget amendments; the federal government faces debt ceiling votes and annual budgets."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "Why is a state balanced budget rule procyclical?", "b": "In a recession revenue falls, so the state must cut spending; lower G lowers PAE and output further."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "What does 'keeping our powder dry' mean for fiscal policy?", "b": "Running surpluses in good times so there is room to borrow for stimulus in the next recession."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "Three design questions for the 2009 stimulus?", "b": "How big (how far did PAE fall), what mix (G versus tax cuts, and speed), and how long (as long as PAE stays depressed)."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "His verdict on the 2009 Recovery Act?", "b": "It counteracted some, but by no means all, of the fall in output: PAE3 between PAE2 and PAE1."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "What does his slide say are 'the keys' to offsetting a shock with a tax cut?", "b": "Timing and magnitude, and neither is super obvious. Too late or too big overshoots Y*; too small leaves a gap."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "What happened to PAE in 2008?", "b": "Investment fell (especially housing, and credit was hard to get) and consumption fell (lost wealth and confidence), so PAE shifted down a lot."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "Why does the economy-wide mpc depend on who gets the money?", "b": "His slide: the poor have an mpc near 1 while the rich have a much lower mpc, so the aggregate mpc is an average."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "What are automatic stabilizers (textbook)?", "b": "Taxes and transfers that move countercyclically on their own: in a recession tax collections fall and benefits rise, which props up disposable income."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "Why is there a multiplier, in rounds?", "b": "A $1 rise in spending raises income $1; people spend mpc of it, then mpc² of that, and so on: 1 + mpc + mpc² + ... = 1 ÷ (1 − mpc)."}, {"u": "09-fiscal", "t": "Fiscal policy", "f": "His slides 10 and 11: a $1 trillion PAE drop lowers Y to 29 with flat PAE and to what with sloped PAE?", "b": "To 27.5, a fall of 2.5, which goes with mpc = 0.6."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "What is the Fed charged with?", "b": "Maintaining low and stable inflation and full employment."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "What is the Fed's key policy tool, per his slides?", "b": "The real interest rate, which it moves by changing nominal rates."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "What is monetary policy?", "b": "Actions taken by the central bank to affect nominal and real interest rates."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "Contractionary versus expansionary monetary policy?", "b": "Contractionary raises nominal and real interest rates; expansionary lowers them."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "What two things make interest rates differ?", "b": "The riskiness of the bond or loan and its maturity. Different rates still generally move together."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "What is a credit s
