pread?", "b": "How much the interest rate on risky bonds and loans exceeds the rate on safe assets."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "What is an open-market operation?", "b": "The Fed creates money and trades it for financial assets, most often short-term U.S. government debt."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "Is an open-market purchase fiscal policy?", "b": "No. The Fed swaps money for bonds; it is not adding to government spending or making transfers."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "What are reserves?", "b": "Money held by banks."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "Two conventional tools that move the general level of interest rates?", "b": "Changing the interest rate the Fed pays on reserves, and changing the supply of reserves through open-market operations."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "What is the federal funds rate?", "b": "The rate banks charge each other for overnight loans of reserves; the Fed targets it."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "What happened to the federal funds rate in 2007 to 2008?", "b": "It went from a little above 5 percent in mid-2007 to near zero by the end of 2008."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "Real interest rate formula?", "b": "r = i − π (or i − πe): the nominal rate minus inflation (or expected inflation)."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "i = 4.5 percent, π = 3 percent. Real rate?", "b": "r = 1.5 percent."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "Why does a change in i change r in the short run?", "b": "Inflation inertia: inflation changes only slowly, so r moves with i."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "Can the Fed hold r away from r* forever?", "b": "No. In the long run r must equal r*, the rate that balances saving and investment at full employment."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "How does a higher real interest rate affect C, I, and NX?", "b": "Planned investment falls, saving rises so consumption falls, and net exports fall. PAE falls at a given Y."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "Draw a rate hike on the Keynesian cross.", "b": "PAE shifts down in parallel (lower intercept, same slope mpc); equilibrium output falls by the multiplier times the drop."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "What happens to an existing bond's price when interest rates rise?", "b": "It falls, because its fixed payments are discounted more heavily (present value)."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "Price of $1,000 due in 10 years at 2 percent and at 5 percent?", "b": "$820.35 at 2 percent; $613.91 at 5 percent, a loss of about a quarter."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "Why did Silicon Valley Bank get in trouble?", "b": "Many of its assets were long-term Treasury bonds; when rates rose their value fell, eroding its equity and triggering withdrawals."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "PAE = (18 − 100r) + 0.5Y, r = 3 percent, Y* = 34. What r closes the gap?", "b": "Need autonomous spending 34 × 0.5 = 17, so 18 − 100r = 17 and r = 1 percent."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "Three reasons the Fed might change rates, per his slides?", "b": "To offset another force shifting PAE (countercyclical), to pursue another objective (inflation), or by mistake."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "What did monetary policy do in the Great Depression?", "b": "The money stock and reserves fell and the real rate rose, shifting PAE down further (PAE3): a mistake."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "What did monetary policy do in 2007 to 2008?", "b": "The Fed cut rates toward zero, which shifted PAE back up part of the way (PAE3): countercyclical policy."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "What is financial intermediation?", "b": "The process of getting saving into productive investment, done by banks, investment banks, money market funds, pension funds, and others."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "Stylized bank balance sheet?", "b": "Assets: loans, reserves, bonds. Sources of funds: short-term borrowing (deposits) and equity (capital)."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "When is a bank insolvent?", "b": "When its assets are worth less than its obligations to depositors and lenders, so equity is negative."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "How can fear alone sink a bank?", "b": "Belief that it might become insolvent makes depositors withdraw and lenders stop lending, which can cause the insolvency."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "What is a financial crisis?", "b": "A time when many financial institutions are in danger of failing and people lose confidence in them, disrupting financial intermediation."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "Four contagion channels?", "b": "Confidence, linkage (direct loans and contracts), fire sales (dumping assets lowers others' asset prices), and macroeconomic (lower PAE and Y)."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "How does a financial crisis lower PAE?", "b": "It raises credit spreads, tightens lending standards, and hurts consumer and firm confidence."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "Policies to prevent financial crises?", "b": "Higher capital requirements, deposit insurance, regulation of risk-taking and linkages, and stable monetary and fiscal policy."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "Why can't nominal rates go much below zero?", "b": "Currency offers a zero nominal return for sure, so people would hold cash rather than lend at a negative rate."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "What is forward guidance?", "b": "Statements or actions that influence expectations about future nominal interest rates."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "What is quantitative easing?", "b": "Buying bonds other than short-term government debt (like long-term Treasuries or mortgage-backed securities) with reserves."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "Banks: loans 80, reserves 10, bonds 30; owes 110. Bonds lose 25 percent. Equity?", "b": "Assets 112.5, equity 2.5. If 10 percent of loans then default, assets are 104.5 and the bank is insolvent."}, {"u": "10-monetary", "t": "Monetary policy and financial markets", "f": "Fall 2025 review slide 47: how does a Fed rate cut raise PAE?", "b": "Lower real rates increase I and parts of C like new car purchases, and raise NX through a currency depreciation."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "What is the output gap?", "b": "Actual GDP minus potential GDP, Y − Y*. Negative is a recessionary gap; positive is an expansionary gap."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "What is potential GDP (Y*)?", "b": "The output the economy's labor, capital, and technology produce when they are in normal use. He also writes it as Y-bar."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "What happens to unemployment when the output gap is negative?", "b": "Unemployment is above its normal long-run level, because some workers and machines sit idle."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "How are the real and nominal interest rates related?", "b": "r = i − π, so i = r + π. Example: i = 5% and π = 2% give r = 3%."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "Why can the Fed choose the real interest rate in the very short run?", "b": "Inflation is fixed in the very short run, so every change in the nominal rate i is a one-for-one change in r = i − π."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "What is the Fed's key policy tool in this course?", "b": "The real interest rate r, which it sets by choosing the nominal interest rate."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "Why does a higher real interest rate lower PAE at a given Y?", "b": "Planned investment falls, interest-sensitive consumption like new cars falls (saving pays more), and net exports fall because the dollar appreciates."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "How does a rise in r appear in the Keynesian cross?", "b": "The PAE line shifts down in parallel (same slope, the mpc). Equilibrium Y falls by the multiplier times the downward shift."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "PAE = A + ½Y and A = 24 − 3r. What is Y at r = 3% and at r = 3.5%?", "b": "At r = 3%, A = 15 and Y = 30. At r = 3.5%, A = 13.5 and Y = 27. PAE fell 1.5 and Y fell 3."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "What are nominal rigidities, or inflation inertia?", "b": "Inflation does not change much in the short run because of limited information, menu costs, and long-term contracts."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "What happens to inflation over time when Y > Y*?", "b": "It gradually rises. Firms above comfortable capacity raise prices by more than past inflation."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "What happens to inflation over time when Y < Y*?", "b": "It gradually falls, because the same forces work in the opposite direction."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "Why does inflation hold steady when Y = Y*?", "b": "Firms raise prices just enough to keep up with expected inflation, and expected inflation comes mostly from past inflation."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "What is an inflation shock?", "b": "A sudden jump, usually upward, in a small set of prices (often oil) for reasons unrelated to how Y compares with Y*. It changes inflation immediately."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "What is the Fed's reaction function?", "b": "Its rule of raising the real interest rate when inflation rises and lowering it when inflation falls, to keep inflation from getting too low or too high."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "His slide 17 reaction function: what r and i go with π = 3%?", "b": "r − 3 = 0.5(3 − 2), so r = 3.5%, and i = r + π = 6.5%. Output dips below potential."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "His slide 17 reaction function: what r and i go with π = 5%?", "b": "r = 3 + 0.5(3) = 4.5% and i = 9.5%. Output dips more negative."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "His slide 17 reaction function: what r and i go with π = 1%?", "b": "r = 3 + 0.5(−1) = 2.5% and i = 3.5%. Output dips positive."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "Why is deflation a problem for the reaction function?", "b": "With π = −2% the rule wants r = 1%, which needs a nominal rate of −1%, and nominal rates cannot go far below zero."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "What determines inflation in the long run?", "b": "The reaction function: long-run inflation is the π where the RF line is at the long-run real rate r*."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "RF is r = 1 + 0.5π and r* = 3%. What is long-run inflation?", "b": "3 = 1 + 0.5π, so π = 4%."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "Who sets the real interest rate in the long run?", "b": "Not the Fed. Long-run r* is set by saving and investment. 'The Fed has no choice about what r is in the long run.'"}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "Describe how the economy returns to potential from Y < Y*.", "b": "Inflation gradually falls, the Fed lowers r along its reaction function, PAE shifts up, and Y rises. This repeats until PAE crosses the 45° line at Y*."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "Describe how the economy returns to potential from Y > Y*.", "b": "Inflation gradually rises, the Fed raises r, PAE shifts down, and Y falls until it is back at Y*."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "What does the Fed do to lower inflation permanently?", "b": "It shifts its reaction function up, so it sets a higher r at every inflation rate."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "Short-run effects when the Fed shifts its reaction function up?", "b": "Inflation does not change, r rises, the PAE line shifts down, and Y falls by more than the shift because of the multiplier: a recession."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "Long-run effects of shifting the reaction function up?", "b": "Y back at Y*, r back at r*, investment and consumption back where they were, and inflation lower."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "Why is inflation lower after a deliberate disinflation?", "b": "Inflation was falling the whole time Y was below Y*, and Y was never above Y*."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "Is an oil shock a movement along or a shift of the reaction function?", "b": "A movement along it. Inflation changed and the Fed followed its usual rule, so long-run inflation does not change."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "What are three reasons a central bank changes rates?", "b": "To offset another force shifting PAE (countercyclical policy), to pursue another objective such as lowering inflation, or by mistake (the Great Depression)."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "What happened in the Great Depression in his Keynesian cross?", "b": "PAE fell once because autonomous consumption fell, then again because monetary contraction raised the real interest rate."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "What is a financial crisis?", "b": "A time when many financial institutions are in danger of failing, people lose confidence in them, and lending is widely disrupted."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "How does a financial crisis lower PAE?", "b": "It raises credit spreads, tightens lending standards, and hurts consumer and firm confidence, so PAE shifts down at every Y."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "Why did Silicon Valley Bank's bonds lose value in 2023?", "b": "Bond prices are present values of fixed payments. When interest rates rose, the prices of its long-term Treasury bonds fell."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "A bond pays $1,000 in two years. Price at i = 2% and at i = 5%?", "b": "1,000 ÷ 1.0404 = $961.17 and 1,000 ÷ 1.1025 = $907.03, a loss of $54.14."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "What did the FDIC do when SVB failed?", "b": "It moved to cover all deposits, beyond the usual $250,000 per account."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "Why does he call good or bad policy 'a little tricky'?", "b": "Inflation typically rises (bad) when GDP is above potential (good), so policy that raises output today can raise inflation later."}, {"u": "11-inflation", "t": "Inflation and the return to potential", "f": "In the textbook's AD and IA graph, what is the IA line?", "b": "A horizontal line at current inflation, because inflation is fixed in the short run. It drifts down when Y < Y* and up when Y > Y*."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "What is the nominal exchange rate?", "b": "The price of one currency in terms of another, for example €0.86 per $1."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "Define appreciation of the dollar.", "b": "The price of the dollar in some foreign currency rises. The dollar is 'stronger.'"}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "Define depreciation of the dollar.", "b": "The price of the dollar in some foreign currency falls. The dollar is 'weaker.'"}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "The rate falls from ¥160 to ¥150 per $1. Which currency appreciated?", "b": "The yen appreciated and the dollar depreciated. The number is the price of a dollar, and it fell (Fall 2025 final MC)."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "The rate rises from ¥150 to ¥160 per $1. Which currency appreciated?", "b": "The dollar appreciated and the yen depreciated."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "The price of a euro rises from $1.10 to $1.20. Which currency appreciated?", "b": "The euro appreciated and the dollar depreciated. The quote is dollars per euro, so it is the euro's price."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "Convert ¥160 and ¥150 per $1 into dollars per yen.", "b": "1 ÷ 160 = $0.00625 and 1 ÷ 150 = $0.006667. The yen's price rose."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "Convert €0.86 per $1 into dollars per euro.", "b": "1 ÷ 0.86 = $1.1628 per euro."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "The dollar goes from ¥160 to ¥150. Percent change for each currency?", "b": "Dollar: (150 − 160) ÷ 160 = −6.25%. Yen: 160 ÷ 150 − 1 = +6.67%."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "What does currency appreciation do to exports?", "b": "It raises export prices in foreign currency and tends to reduce exports, while imports get cheaper, so NX falls."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "A ¥30,000 good costs how much in dollars at ¥160 and at ¥150 per $1?", "b": "$187.50 and $200.00."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "Who demands dollars in the foreign exchange market?", "b": "Foreigners who want to buy American goods, services, or assets."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "Who supplies dollars in the foreign exchange market?", "b": "Americans who want to buy foreign goods, services, or assets."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "How are the axes of his foreign exchange graph labeled?", "b": "Quantity of $ traded across; price of $ in foreign currency (like € per $1) up."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "What happens in the market for dollars when the U.S. real interest rate rises?", "b": "Demand for dollars shifts right and supply shifts left, so the dollar appreciates."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "What happens to the dollar when the Bank of Japan raises its rate?", "b": "Demand for dollars falls and supply rises, so the dollar depreciates against the yen. U.S. asset prices fall and U.S. interest rates rise."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "Why would any central bank raise interest rates, per Class 23?", "b": "To reduce inflation by lowering PAE, through lower investment and through an appreciated currency and lower net exports."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "Effect of a fad for Paris among U.S. tourists?", "b": "Americans supply more dollars, supply shifts right, and the dollar depreciates."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "What raises demand for a country's currency in the short run?", "b": "A higher domestic real interest rate, global uncertainty that sends investors to safe havens, and higher demand for its exports."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "Write the balance of payments identity.", "b": "EX + KI = IM + KO: exports plus capital inflows equal imports plus capital outflows."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "What is the relation between NX and NKI?", "b": "NX = −NKI. A trade deficit equals net capital inflows."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "EX = 3.2, IM = 4.1, KO = 1.3 (trillions). Find KI, NX, NKI.", "b": "KI = 4.1 + 1.3 − 3.2 = 2.2. NX = −0.9. NKI = +0.9."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "What determines net capital inflows?", "b": "The U.S. real interest rate (up raises NKI), foreign real rates (up lowers NKI), and tastes for U.S. versus foreign assets."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "What is the long-run condition with trade and capital flows?", "b": "S* + NKI* = I*. The long-run real rate is the one that makes saving plus net capital inflows equal investment."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "S = 4.6 and I = 5.5 (trillions). What are NKI and NX?", "b": "NKI = 0.9 and NX = −0.9."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "Why does the U.S. run trade deficits, per his slide 9?", "b": "Its investment exceeds its saving, so it imports capital and runs a trade deficit. China's surpluses reflect its very high saving."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "Short-run effect of U.S. tariffs on many goods in the foreign exchange market?", "b": "Americans buy fewer imports, so the supply of dollars shifts left and the dollar appreciates."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "Overall effect of the tariffs on NX in his model?", "b": "None. The direct rise in NX is canceled by the stronger dollar; NKI does not change, so NX = −NKI does not change."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "Will tariffs have literally no effect on NX?", "b": "Almost surely not, since all models are approximations, but the effect is likely small because the dollar's appreciation works against it."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "Why do 'low quality' and 'tastes for imports' fail to explain the U.S. deficit?", "b": "They predict a weak dollar, not a large trade deficit."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "What has contributed to the persistent U.S. trade deficit?", "b": "U.S. assets look highly attractive (tech in the 1990s, housing in the early 2000s, maybe AI now), so NKI is large and positive and NX is large and negative."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "What does a shift in tastes toward U.S. assets do to the dollar?", "b": "Demand for dollars rises and supply falls, so the dollar appreciates and NX falls."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "What is the law of one price?", "b": "With small transport costs and no trade barriers, a traded good should cost the same everywhere after converting currencies. A $1,000 computer should cost ¥155,960 at ¥155.96 per $1."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "What is the real exchange rate (textbook)?", "b": "(e × P) ÷ Pf: U.S. prices relative to foreign prices in a common currency. Above 1 means U.S. goods are relatively expensive."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "What is a flexible exchange rate?", "b": "One determined by supply and demand in the market, as most are today."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "How is a fixed exchange rate maintained?", "b": "A central bank buys and sells foreign reserves. China fixed its rate to the dollar from 1999 to 2005."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "A fixed rate is set above the market price of the dollar. What must the central bank do?", "b": "Buy the excess supply of dollars with its own currency, adding to its dollar reserves."}, {"u": "12-intl-macro", "t": "Exchange rates and international macro", "f": "How does a Fed rate cut affect NX?", "b": "Lower r means fewer foreign purchases of U.S. assets and more U.S. purchases abroad, so the dollar depreciates and NX rises, raising PAE."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "Markets help participants match the level of their marginal benefit to the level of what?", "b": "Marginal cost. You keep doing something while MB is above MC and stop where MB = MC. This was Fall 2025 final Q1(a)."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "In a market graph, which curve is marginal benefit and which is marginal cost?", "b": "Demand is the marginal benefit curve and supply is the marginal cost curve, so the equilibrium quantity is where MB = MC."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "What is opportunity cost?", "b": "The value of the next best alternative you give up when you make a choice."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "What is in the opportunity cost of a year of college?", "b": "Tuition plus the earnings you give up by not working. Rent and food cancel out because you pay them either way."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "What is comparative advantage?", "b": "Having a lower opportunity cost of a task than someone else. Gains from trade come from it."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "What does the principle of comparative advantage imply (Fall 2025 final Q1(b))?", "b": "I should specialize in doing the task that I do best. Specializing in every task you do better than others is the absolute advantage trap."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "Absolute advantage versus comparative advantage?", "b": "Absolute advantage means more output per hour. Comparative advantage means a lower opportunity cost. Only comparative advantage decides who should specialize in what."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "Bill: 1 fish or 1 coconut per hour. Chris: 8 fish or 2 coconuts per hour. Who fishes?", "b": "Chris fishes and Bill gathers coconuts. A coconut costs Bill 1 fish and costs Chris 4 fish, so Bill has the lower opportunity cost of coconuts."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "A new tool doubles one person's output of both goods. What happens to comparative advantage?", "b": "Nothing. Their opportunity cost of each good stays the same, so who should do which task does not change."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "Bill and Chris joint PPC (10 hours each): where is the kink and what are the slopes?", "b": "The kink is at 10 coconuts and 80 fish. The first segment has slope -1 (Bill gathers first), the second has slope -4 (Chris)."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "What shifts a demand curve, and what only moves you along it?", "b": "Income, the price of a substitute or complement, and tastes shift demand. A change in the good's own price only moves you along the curve."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "Demand increases. What happens to price and quantity?", "b": "Both rise. The equilibrium slides up along the unchanged supply curve."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "Supply decreases (a frost, a virus, a tax). What happens to price and quantity?", "b": "Price rises and quantity falls. The equilibrium slides up along the unchanged demand curve."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "The price of gasoline rises. What happens to the demand for SUVs?", "b": "It shifts left, because gasoline is a complement to SUVs and makes owning one more expensive."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "What is consumer surplus on a graph?", "b": "The area below the demand curve and above the price paid."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "What is producer surplus on a graph, and why?", "b": "The area above the supply curve and below the price. Sellers get the price on every unit but only need to cover that unit's marginal cost."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "What does a competitive market with no market failure maximize?", "b": "Total surplus, consumer plus producer surplus, because it produces exactly where MB = MC."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "What does a binding price ceiling do?", "b": "Neither curve shifts. The quantity traded falls to the quantity supplied, there is a shortage equal to quantity demanded minus quantity supplied, and there is a deadweight loss."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "Formula for price elasticity of demand?", "b": "Elasticity = (% change in quantity) ÷ (% change in price). Quantity goes on top."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "Price rises 20% and quantity falls 10%. Elasticity and spending?", "b": "-10% ÷ 20% = -0.5, inelastic. Spending rises, by 8% here (1.20 × 0.90 = 1.08)."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "Inelastic means steep or flat?", "b": "Inelastic means steep. Elastic means flat."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "When is demand inelastic?", "b": "When there are no close substitutes, when the good is a necessity, or in the short run."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "A crop is planted and cannot be stored. What does short-run supply look like, and what happens if demand collapses?", "b": "Supply is vertical at the planted quantity. The whole adjustment falls on price, read off demand at that quantity, so the price falls a lot."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "How do you draw a per-unit tax on a supply and demand graph?", "b": "A vertical wedge equal to the tax at the new, smaller quantity. Buyers pay the price on demand, sellers keep the price on supply, and the deadweight loss triangle points back to the old equilibrium."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "Who bears more of a tax?", "b": "The less elastic (steeper) side. It does not matter who sends the money to the government."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "Demand P = 10 - Q, supply P = 2 + Q, a $2 tax. Quantity and prices?", "b": "Q falls from 4 to 3. Buyers pay $7, sellers keep $5. Revenue is 6 and the deadweight loss is 1."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "What is the rational spending rule?", "b": "MU_a ÷ P_a = MU_b ÷ P_b. The last dollar spent on each good should bring the same marginal utility."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "MU per dollar on pizza is higher than on tacos. What do you do?", "b": "Buy more pizza and fewer tacos. Pizza's MU falls and tacos' MU rises until the ratios are equal."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "Coffee $4 (MU 10, then 8) and frozen yogurt $6 (MU 12, then 8), $14 a day. Best bundle?", "b": "2 coffees and 1 frozen yogurt. Then 8 ÷ $4 = 12 ÷ $6 = 2."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "Where does a price-taking firm produce?", "b": "Where price equals marginal cost, because its marginal revenue is the market price."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "What is a competitive firm's supply curve, and what is market supply?", "b": "The firm's supply curve is its MC curve. Market supply is the sum of all firms' MC curves."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "Compared with perfect competition, what does a monopolist do to price and quantity?", "b": "It raises price and reduces quantity. This was Fall 2025 final Q1(f)."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "How does a monopolist pick quantity and price?", "b": "It produces where MR = MC, then charges the price on the demand curve at that quantity."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "With straight-line demand P = a - bQ, what is MR?", "b": "MR = a - 2bQ: the same intercept and twice as steep."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "Demand P = 5 - Q and MC = $1. Monopoly versus competition?", "b": "Monopoly: MR = 5 - 2Q = 1 gives Q = 2 and P = $3. Competition: Q = 4 and P = $1. Deadweight loss = 2."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "Taylor Swift numbers: P = 300 - 10Q, MC = 10Q. Monopoly outcome?", "b": "MR = 300 - 20Q equals MC at Q = 10 million, so P = $200. Competition would give 15 million at $150. Deadweight loss $250 million."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "At the monopoly quantity, how do MB and MC compare?", "b": "MB > MC. Buyers would pay more than the cost for more units, which is the deadweight loss."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "What is an externality?", "b": "A cost or benefit of a market activity that falls on people outside the market."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "Formula for social marginal cost?", "b": "SMC = PMC + EMC: private marginal cost plus external marginal cost."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "With a negative externality, does the market produce too much or too little?", "b": "Too much. Firms ignore the external cost, so the market quantity is above the efficient quantity where demand meets SMC."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "What Pigouvian tax fixes a negative externality?", "b": "A per-unit tax equal to the external marginal cost at the efficient quantity. It lifts supply up to SMC."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "Is the efficient amount of pollution zero?", "b": "Usually not. It is where social marginal benefit equals social marginal cost, which is normally a positive amount."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "Why can't a Big Mac's marginal cost fall much over time?", "b": "It needs workers and a facility and cannot be automated in a factory, so mechanization cannot cut its cost much. Fall 2025 final Q2(b)."}, {"u": "13-micro-review", "t": "Midterm material refresher", "f": "Labor demand formula, and what happens if the output price falls?", "b": "MRPL = MR × MPL. A lower output price lowers MR, so labor demand shifts in and the wage and employment fall."}];</script>
